{% extends "vidyastra/dashboard_layout.html" %}
{% block title %}Student Profile - Vidyastra{% endblock %}
{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-lg-10">
    <div class="card p-4">
      <h3 class="text-white mb-3">Student Profile</h3>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ profile.name or '' }}"></div>
          <div class="col-md-6"><label class="form-label">Email</label><input name="email" class="form-control" value="{{ profile.email or '' }}"></div>
          <div class="col-md-4"><label class="form-label">Department</label><input name="department" class="form-control" value="{{ profile.department or '' }}"></div>
          <div class="col-md-4"><label class="form-label">Year</label><input name="year" class="form-control" value="{{ profile.year or '' }}"></div>
          <div class="col-md-4"><label class="form-label">CGPA</label><input name="cgpa" class="form-control" value="{{ profile.cgpa or '' }}"></div>
          <div class="col-md-6"><label class="form-label">Skills (comma separated)</label><input name="skills" class="form-control" value="{{ (profile.skills or [])|join(', ') }}"></div>
          <div class="col-md-6"><label class="form-label">Interests (comma separated)</label><input name="interests" class="form-control" value="{{ (profile.interests or [])|join(', ') }}"></div>
          <div class="col-12"><label class="form-label">Career Goals</label><textarea name="career_goals" class="form-control">{{ profile.career_goals or '' }}</textarea></div>
          <div class="col-12"><label class="form-label">Learning Preferences</label><textarea name="learning_preferences" class="form-control">{{ profile.learning_preferences or '' }}</textarea></div>
          <div class="col-12"><label class="form-label">Academic History</label><textarea name="academic_history" class="form-control">{{ profile.academic_history or '' }}</textarea></div>
          <div class="col-12"><label class="form-label">Profile Image URL</label><input name="profile_image_url" class="form-control" value="{{ profile.profile_image_url or '' }}"></div>
          <div class="col-12"><button class="btn btn-primary">Save Profile</button></div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
