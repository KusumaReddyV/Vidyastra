{% extends "vidyastra/dashboard_layout.html" %}
{% block title %}Recommendations - Vidyastra{% endblock %}
{% block dashboard_content %}
<div class="vid-page-nav d-flex flex-wrap gap-2">
  <a href="{{ url_for('dashboard.home') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-house me-1"></i>Dashboard</a>
</div>
<div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
  <div>
    <h3 class="text-white mb-1">Resume Intelligence</h3>
    <p class="text-muted mb-0">Personalized insights from your resume, quizzes, and career goals.</p>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary" id="recoRefresh"><i class="fas fa-rotate me-2"></i>Refresh</button>
  </div>
</div>

<div class="card p-3">
  <ul class="nav nav-pills gap-2" id="recoTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-reco-tab="learning" type="button"><i class="fas fa-list-check me-2"></i>Learning Plan</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-reco-tab="roadmap" type="button"><i class="fas fa-map me-2"></i>Roadmap</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-reco-tab="internships" type="button"><i class="fas fa-briefcase me-2"></i>Internships</button>
    </li>
  </ul>

  <hr class="border-secondary-subtle my-3">

  <div id="recoLoading" class="d-none">
    <div class="skeleton-line w-60 mb-2"></div>
    <div class="skeleton-line w-100 mb-2"></div>
    <div class="skeleton-line w-80 mb-2"></div>
  </div>
  <div id="recoPaneLearning" class="reco-pane"></div>
  <div id="recoPaneRoadmap" class="reco-pane d-none"></div>
  <div id="recoPaneInternships" class="reco-pane d-none"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  window.recoInitialTab = "{{ initial_tab or 'learning' }}";
</script>
<script src="{{ url_for('static', filename='js/vidyastra/recommendations.js') }}"></script>
{% endblock %}
