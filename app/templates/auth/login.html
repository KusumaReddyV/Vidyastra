{% extends "base.html" %}
{% block title %}Login - Vidyastra{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0">
      <div class="card-body p-4">
        <h3 class="text-white mb-3">Welcome Back</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <a class="small text-muted" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
          <span class="small text-muted">New here? <a href="{{ url_for('auth.signup') }}">Create account</a></span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
