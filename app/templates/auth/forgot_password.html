{% extends "base.html" %}
{% block title %}Forgot Password - Vidyastra{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0">
      <div class="card-body p-4">
        <h3 class="text-white mb-2">Forgot password</h3>
        <p class="text-muted mb-4">Enter your email and we’ll send you a reset link.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>
        <div class="small text-muted mt-3">
          Back to <a href="{{ url_for('auth.login') }}">login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
